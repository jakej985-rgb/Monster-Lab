name: monster_lab
description: "Monster Lab - Kid-focused, hands-on robotics learning app built around the Monster Arduino kit."
publish_to: "none"
version: 0.1.12+22

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/curriculum/courses/
    - assets/curriculum/lessons/
    - assets/curriculum/components/
    - assets/curriculum/projects/
    - assets/curriculum/challenges/
    - assets/curriculum/badges/
    - assets/images/
    - assets/images/components/
