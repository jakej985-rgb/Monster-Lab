name: Monster Lab CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run automated test suite with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold (>= 80%)
        run: python3 scripts/verify_coverage.py --threshold 80.0

      - name: Scan secrets and sensitive patterns
        run: python3 scripts/scan_secrets.py

      - name: Scan dependencies and supply chain
        run: python3 scripts/scan_dependencies.py

      - name: Validate curriculum integrity
        run: python3 scripts/validate_curriculum.py

      - name: Verify release version synchronization
        run: python3 scripts/verify_version_sync.py

      - name: Verify changelog hygiene
        run: python3 scripts/verify_changelog_hygiene.py

      - name: Verify release artifact contracts
        run: python3 scripts/verify_release_artifacts.py

  platform-matrix:
    name: Build (${{ matrix.platform }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Release & Docker (Web only)
        if: matrix.platform == 'web'
        run: |
          flutter build web --release
          docker build -t monster-lab-web:ci .

      - name: Build Linux Desktop (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libserialport-dev
          flutter build linux --release

      - name: Build Windows Runner (Windows only)
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release
