name: Monster Lab Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Initialize Release & Generate Changelog
  # -------------------------------------------------------------
  create-release:
    name: Initialize Release & Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.pkg_ver.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Release Package Version
        id: pkg_ver
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VER="${{ github.ref_name }}"
          else
            SEMVER=$(python3 -c "import yaml; print(yaml.safe_load(open('pubspec.yaml'))['version'].split('+')[0])")
            VER="v${SEMVER}"
          fi
          echo "PACKAGE_VERSION=${VER}" >> $GITHUB_ENV
          echo "package_version=${VER}" >> $GITHUB_OUTPUT
          echo "Using release package version prefix: ${VER}"

      - name: Generate Detailed Release Notes
        run: |
          python3 scripts/generate_release_changelog.py --version "${PACKAGE_VERSION}" --output release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release Notes
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          body_path: release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: false

  # -------------------------------------------------------------
  # Job 2: Dedicated Android Release Build (APK & AAB)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python3 scripts/generate_release_assets.py

      - name: Determine Release Package Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VER="${{ github.ref_name }}"
          else
            SEMVER=$(python3 -c "import yaml; print(yaml.safe_load(open('pubspec.yaml'))['version'].split('+')[0])")
            VER="v${SEMVER}"
          fi
          echo "PACKAGE_VERSION=${VER}" >> $GITHUB_ENV

      - name: Configure Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring Android release keystore from secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/monster-lab-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=monster-lab-release.jks\n" \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to debug signing."
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "monster-lab-${PACKAGE_VERSION}-android.apk"

      - name: Build Android Release AppBundle
        run: flutter build appbundle --release

      - name: Copy Android AppBundle
        run: cp build/app/outputs/bundle/release/app-release.aab "monster-lab-${PACKAGE_VERSION}-android.aab"

      - name: Clean Up Android Keystore Secrets
        if: always()
        run: rm -f android/app/monster-lab-release.jks android/key.properties

      - name: Verify Android release asset naming format
        run: |
          test -f "monster-lab-${PACKAGE_VERSION}-android.apk"
          test -f "monster-lab-${PACKAGE_VERSION}-android.aab"
          echo "Android assets verified!"

      - name: Publish Android Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            monster-lab-*-android.apk
            monster-lab-*-android.aab
          draft: false
          prerelease: false

  # -------------------------------------------------------------
  # Job 3: Dedicated Linux Release Build (Debian, Portable & Keyring)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux Releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/99-autorestart.conf > /dev/null 2>&1 || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=60 \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            clang cmake ninja-build pkg-config libgtk-3-dev libserialport-dev dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python3 scripts/generate_release_assets.py

      - name: Determine Release Package Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VER="${{ github.ref_name }}"
          else
            SEMVER=$(python3 -c "import yaml; print(yaml.safe_load(open('pubspec.yaml'))['version'].split('+')[0])")
            VER="v${SEMVER}"
          fi
          echo "PACKAGE_VERSION=${VER}" >> $GITHUB_ENV

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Debian Installer
        run: python3 scripts/package_linux_deb.py --bundle-dir build/linux/x64/release/bundle --output "monster-lab-${PACKAGE_VERSION}-linux.deb"

      - name: Package Linux Portable Bundle
        run: tar -czf "monster-lab-${PACKAGE_VERSION}-linux-portable.tar.gz" -C build/linux/x64/release/bundle .

      - name: Prepare Linux GPG Keyring Asset
        run: |
          if [ -f linux/keyring/m3tal-archive-keyring.gpg ]; then
            cp linux/keyring/m3tal-archive-keyring.gpg monster-lab-keyring.gpg
          else
            cp linux/keyring/monster-lab-archive-keyring.gpg monster-lab-keyring.gpg
          fi

      - name: Verify Linux release asset naming format
        run: |
          test -f "monster-lab-${PACKAGE_VERSION}-linux.deb"
          test -f "monster-lab-${PACKAGE_VERSION}-linux-portable.tar.gz"
          test -f monster-lab-keyring.gpg
          echo "Linux assets verified!"

      - name: Publish Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            monster-lab-*-linux.deb
            monster-lab-*-linux-portable.tar.gz
            monster-lab-keyring.gpg
          draft: false
          prerelease: false

      - name: Dispatch Linux Deb to Central APT Repository (m3tal-apt-key)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.M3TAL_APT_DISPATCH_TOKEN || secrets.M3TAL_HUB_TOKEN }}
          repository: jakej985-rgb/m3tal-apt-key
          event-type: publish-deb
          client-payload: >-
            {
              "package_id": "monster-lab",
              "repo": "${{ github.repository }}",
              "version": "${{ env.PACKAGE_VERSION }}",
              "deb_url": "https://github.com/${{ github.repository }}/releases/download/${{ env.PACKAGE_VERSION }}/monster-lab-${{ env.PACKAGE_VERSION }}-linux.deb"
            }

  # -------------------------------------------------------------
  # Job 4: Dedicated Windows Release Build (Setup EXE & Portable Zip)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop Releases
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python scripts/generate_release_assets.py

      - name: Determine Release Package Version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match "^v\d") {
            $ver = "${{ github.ref_name }}"
          } else {
            $pubspec = Get-Content pubspec.yaml -Raw
            if ($pubspec -match "version:\s*(\d+\.\d+\.\d+)") {
              $ver = "v" + $Matches[1]
            } else {
              $ver = "v1.0.0"
            }
          }
          "PACKAGE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows Release Binary
        run: flutter build windows --release

      - name: Build Windows Setup Installer EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\monster_lab_setup.iss
          Move-Item "monster-lab-windows.exe" -Destination "monster-lab-$env:PACKAGE_VERSION-windows.exe"

      - name: Package Windows Portable Bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip"

      - name: Verify Windows release asset naming format
        shell: pwsh
        run: |
          if (-not (Test-Path "monster-lab-$env:PACKAGE_VERSION-windows.exe")) { throw "monster-lab-$env:PACKAGE_VERSION-windows.exe missing" }
          if (-not (Test-Path "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip")) { throw "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip missing" }
          Write-Host "All Windows release assets conform to naming schema!"

      - name: Publish Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            monster-lab-*-windows.exe
            monster-lab-*-windows-portable.zip
          draft: false
          prerelease: false

  # -------------------------------------------------------------
  # Job 5: Dedicated Web & Container Release Build (GHCR & Compose)
  # -------------------------------------------------------------
  build-web:
    name: Build Web & Container Releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web PWA Release
        run: flutter build web --release

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Tag and Push Web Docker Image to GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER_LOWER}/monster-lab-web"

          docker build \
            -t "${GHCR_IMAGE}:${{ github.ref_name }}" \
            -t "${GHCR_IMAGE}:latest" \
            -t monster-lab-web:latest .

          docker push "${GHCR_IMAGE}:${{ github.ref_name }}"
          docker push "${GHCR_IMAGE}:latest"

      - name: Generate Pre-filled Docker Compose Release File
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF > docker-compose.yml
          services:
            monster-lab-web:
              image: ghcr.io/${OWNER_LOWER}/monster-lab-web:${{ github.ref_name }}
              container_name: monster-lab-web
              restart: unless-stopped
              ports:
                - "8080:80"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost/healthz"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 5s
          EOF

      - name: Publish Web Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: docker-compose.yml
          draft: false
          prerelease: false
