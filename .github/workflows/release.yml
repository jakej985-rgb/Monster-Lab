name: Monster Lab Release Packaging

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version ([v]X.Y.Z[+BUILD]); blank uses the smart bump'
        required: false
        type: string

concurrency:
  group: monster-lab-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 0: Smart version bump, commit, tag, and push
  # -------------------------------------------------------------
  prepare-release:
    name: Smart Bump & Tag Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')))
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Smart bump, verify, commit, and tag
        id: release
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ -n "$REQUESTED_VERSION" ]; then
            python3 scripts/generate_release_changelog.py --version "$REQUESTED_VERSION" --apply
          else
            python3 scripts/bump_version.py --auto
          fi

          python3 scripts/verify_version_sync.py
          python3 scripts/verify_changelog_hygiene.py

          FULL=$(python3 scripts/bump_version.py --current)
          VERSION="${FULL#v}"
          BUILD="${VERSION##*+}"
          VERSION="${VERSION%%+*}"
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite an existing release." >&2
            exit 1
          fi

          git add \
            CHANGELOG.md \
            Dockerfile \
            lib/core/constants/app_version.dart \
            pubspec.yaml \
            version.json \
            windows/installer/monster_lab_setup.iss \
            windows/runner/Runner.rc

          if git diff --cached --quiet; then
            echo "Smart bump produced no version changes." >&2
            exit 1
          fi

          git commit -m "chore(release): bump version to $TAG"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Released $TAG at $(git rev-parse HEAD)"

  # -------------------------------------------------------------
  # Job 1: Initialize Release & Generate Changelog
  # -------------------------------------------------------------
  create-release:
    name: Initialize Release & Changelog
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Detailed Release Notes
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.tag }}
        run: |
          python3 scripts/generate_release_changelog.py --version "${PACKAGE_VERSION}" --output release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: false

  # -------------------------------------------------------------
  # Job 2: Dedicated Android Release Build (APK & AAB)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Releases
    needs: [prepare-release, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python3 scripts/generate_release_assets.py

      - name: Configure Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring Android release keystore from secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/monster-lab-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=monster-lab-release.jks\n" \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to debug signing."
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "monster-lab-${PACKAGE_VERSION}-android.apk"

      - name: Build Android Release AppBundle
        run: flutter build appbundle --release

      - name: Copy Android AppBundle
        run: cp build/app/outputs/bundle/release/app-release.aab "monster-lab-${PACKAGE_VERSION}-android.aab"

      - name: Clean Up Android Keystore Secrets
        if: always()
        run: rm -f android/app/monster-lab-release.jks android/key.properties

      - name: Verify Android release asset naming format
        run: |
          test -f "monster-lab-${PACKAGE_VERSION}-android.apk"
          test -f "monster-lab-${PACKAGE_VERSION}-android.aab"
          echo "Android assets verified!"

      - name: Publish Android Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            monster-lab-*-android.apk
            monster-lab-*-android.aab
          draft: false
          prerelease: false

  # -------------------------------------------------------------
  # Job 3: Dedicated Linux Release Build (Debian, Portable & Keyring)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux Releases
    needs: [prepare-release, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.prepare-release.outputs.tag }}
      CLEAN_VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Install Linux build dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/99-autorestart.conf > /dev/null 2>&1 || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=60 \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            clang cmake ninja-build pkg-config libgtk-3-dev libserialport-dev dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python3 scripts/generate_release_assets.py

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Debian Installer (Signed with Canonical Key)
        id: deb_build
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE || secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID || secrets.GPG_KEY_ID || '5F84FE50A40111C981410E11775AD1473BF25102' }}
        run: |
          DEB_NAME="monster-lab-${PACKAGE_VERSION}-linux.deb"
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "Importing canonical 50-year GPG key for Debian release signing..."
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            python3 scripts/package_linux_deb.py --bundle-dir build/linux/x64/release/bundle --output "$DEB_NAME" --version "$CLEAN_VERSION" --sign --key-id "$GPG_KEY_ID" --passphrase "$GPG_PASSPHRASE"
          else
            python3 scripts/package_linux_deb.py --bundle-dir build/linux/x64/release/bundle --output "$DEB_NAME" --version "$CLEAN_VERSION"
          fi
          SHA256=$(sha256sum "$DEB_NAME" | cut -d ' ' -f1)
          echo "deb_sha256=${SHA256}" >> $GITHUB_ENV
          echo "deb_sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "Debian package created with SHA256: ${SHA256}"

      - name: Package Linux Portable Bundle
        run: tar -czf "monster-lab-${PACKAGE_VERSION}-linux-portable.tar.gz" -C build/linux/x64/release/bundle .

      - name: Prepare Linux GPG Keyring Asset
        run: |
          cp linux/keyring/m3tal-archive-keyring.gpg m3tal-archive-keyring.gpg
          # Provide backward-compatibility copy
          cp linux/keyring/m3tal-archive-keyring.gpg monster-lab-keyring.gpg

      - name: Verify Linux release asset naming format
        run: |
          test -f "monster-lab-${PACKAGE_VERSION}-linux.deb"
          test -f "monster-lab-${PACKAGE_VERSION}-linux-portable.tar.gz"
          test -f m3tal-archive-keyring.gpg
          echo "Linux assets verified!"

      - name: Publish Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            monster-lab-*-linux.deb
            monster-lab-*-linux.deb.asc
            monster-lab-*-linux-portable.tar.gz
            m3tal-archive-keyring.gpg
            monster-lab-keyring.gpg
          draft: false
          prerelease: false

      - name: Validate APT Dispatch Credentials
        id: apt_token
        run: |
          TOKEN="${{ secrets.M3TAL_APT_DISPATCH_TOKEN || secrets.HUB_DISPATCH_TOKEN || secrets.M3TAL_HUB_TOKEN || secrets.GH_PAT }}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::APT repository dispatch skipped. No dispatch token configured (M3TAL_APT_DISPATCH_TOKEN, HUB_DISPATCH_TOKEN, M3TAL_HUB_TOKEN, or GH_PAT)."
            echo "Signed Debian release was published, but automatic publishing to the central APT repo was not attempted."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "APT dispatch token is present and verified."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Linux Deb to Central APT Repository (m3tal-apt-key)
        if: steps.apt_token.outputs.configured == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.M3TAL_APT_DISPATCH_TOKEN || secrets.HUB_DISPATCH_TOKEN || secrets.M3TAL_HUB_TOKEN || secrets.GH_PAT }}
          repository: jakej985-rgb/m3tal-apt-key
          event-type: publish-deb
          client-payload: >-
            {
              "package_id": "monster-lab",
              "repo": "${{ github.repository }}",
              "version": "${{ env.CLEAN_VERSION }}",
              "tag": "${{ env.PACKAGE_VERSION }}",
              "deb_url": "https://github.com/${{ github.repository }}/releases/download/${{ env.PACKAGE_VERSION }}/monster-lab-${{ env.PACKAGE_VERSION }}-linux.deb",
              "sha256": "${{ env.deb_sha256 }}",
              "allow_replace": false
            }

  # -------------------------------------------------------------
  # Job 4: Dedicated Windows Release Build (Setup EXE & Portable Zip)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop Releases
    needs: [prepare-release, create-release]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python scripts/generate_release_assets.py

      - name: Build Windows Release Binary
        run: flutter build windows --release

      - name: Build Windows Setup Installer EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\monster_lab_setup.iss
          Move-Item "monster-lab-windows.exe" -Destination "monster-lab-$env:PACKAGE_VERSION-windows.exe"

      - name: Package Windows Portable Bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip"

      - name: Verify Windows release asset naming format
        shell: pwsh
        run: |
          if (-not (Test-Path "monster-lab-$env:PACKAGE_VERSION-windows.exe")) { throw "monster-lab-$env:PACKAGE_VERSION-windows.exe missing" }
          if (-not (Test-Path "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip")) { throw "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip missing" }
          Write-Host "All Windows release assets conform to naming schema!"

      - name: Publish Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            monster-lab-*-windows.exe
            monster-lab-*-windows-portable.zip
          draft: false
          prerelease: false

  # -------------------------------------------------------------
  # Job 5: Dedicated Web & Container Release Build (GHCR & Compose)
  # -------------------------------------------------------------
  build-web:
    name: Build Web & Container Releases
    needs: [prepare-release, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web PWA Release
        run: flutter build web --release

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Tag and Push Web Docker Image to GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER_LOWER}/monster-lab-web"

          docker build \
            -t "${GHCR_IMAGE}:${PACKAGE_VERSION}" \
            -t "${GHCR_IMAGE}:latest" \
            -t monster-lab-web:latest .

          docker push "${GHCR_IMAGE}:${PACKAGE_VERSION}"
          docker push "${GHCR_IMAGE}:latest"

      - name: Generate Pre-filled Docker Compose Release File
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF > docker-compose.yml
          services:
            monster-lab-web:
              image: ghcr.io/${OWNER_LOWER}/monster-lab-web:${PACKAGE_VERSION}
              container_name: monster-lab-web
              restart: unless-stopped
              ports:
                - "8080:80"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost/healthz"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 5s
          EOF

      - name: Publish Web Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: docker-compose.yml
          draft: false
          prerelease: false
