name: Monster Lab Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-ubuntu-targets:
    name: Build Android, Linux & Web Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libserialport-dev dpkg-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python3 scripts/generate_release_assets.py

      - name: Validate curriculum integrity
        run: python3 scripts/validate_curriculum.py

      - name: Determine Release Package Version
        id: pkg_ver
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VER="${{ github.ref_name }}"
          else
            SEMVER=$(python3 -c "import yaml; print(yaml.safe_load(open('pubspec.yaml'))['version'].split('+')[0])")
            VER="v${SEMVER}"
          fi
          echo "PACKAGE_VERSION=${VER}" >> $GITHUB_ENV
          echo "package_version=${VER}" >> $GITHUB_OUTPUT
          echo "Using release package version prefix: ${VER}"

      # -------------------------------------------------------------
      # Linux Builds: [app]-[os].[ext], [app]-[os]-portable.[ext] & Keyring
      # -------------------------------------------------------------
      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Debian Installer (monster-lab-linux.deb & monster-lab-${PACKAGE_VERSION}-linux.deb)
        run: |
          python3 scripts/package_linux_deb.py --bundle-dir build/linux/x64/release/bundle --output monster-lab-linux.deb
          cp monster-lab-linux.deb "monster-lab-${PACKAGE_VERSION}-linux.deb"

      - name: Package Linux Portable Bundle (monster-lab-linux-portable.tar.gz & monster-lab-${PACKAGE_VERSION}-linux-portable.tar.gz)
        run: |
          tar -czf monster-lab-linux-portable.tar.gz -C build/linux/x64/release/bundle .
          cp monster-lab-linux-portable.tar.gz "monster-lab-${PACKAGE_VERSION}-linux-portable.tar.gz"

      - name: Prepare Linux GPG Keyring Asset
        run: cp linux/keyring/monster-lab-archive-keyring.gpg monster-lab-keyring.gpg

      # -------------------------------------------------------------
      # Android Builds: [app]-[os].[ext]
      # -------------------------------------------------------------
      - name: Configure Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring Android release keystore from secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/monster-lab-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=monster-lab-release.jks\n" \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to debug signing."
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy Android APK (monster-lab-android.apk & monster-lab-${PACKAGE_VERSION}-android.apk)
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk monster-lab-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk "monster-lab-${PACKAGE_VERSION}-android.apk"

      - name: Build Android Release AppBundle
        run: flutter build appbundle --release

      - name: Copy Android AppBundle (monster-lab-android.aab & monster-lab-${PACKAGE_VERSION}-android.aab)
        run: |
          cp build/app/outputs/bundle/release/app-release.aab monster-lab-android.aab
          cp build/app/outputs/bundle/release/app-release.aab "monster-lab-${PACKAGE_VERSION}-android.aab"

      - name: Clean Up Android Keystore Secrets
        if: always()
        run: |
          rm -f android/app/monster-lab-release.jks android/key.properties

      # -------------------------------------------------------------
      # Web Builds: Docker Container Image [app]-[os]-docker.[ext] & GHCR
      # -------------------------------------------------------------
      - name: Build Web PWA Release
        run: flutter build web --release

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Tag and Push Web Docker Image to GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER_LOWER}/monster-lab-web"

          echo "Building and pushing container image: ${GHCR_IMAGE}:${{ github.ref_name }}"
          docker build \
            -t "${GHCR_IMAGE}:${{ github.ref_name }}" \
            -t "${GHCR_IMAGE}:latest" \
            -t monster-lab-web:latest .

          docker push "${GHCR_IMAGE}:${{ github.ref_name }}"
          docker push "${GHCR_IMAGE}:latest"

      - name: Generate Pre-filled Docker Compose Release File
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF > docker-compose.yml
          services:
            monster-lab-web:
              image: ghcr.io/${OWNER_LOWER}/monster-lab-web:${{ github.ref_name }}
              container_name: monster-lab-web
              restart: unless-stopped
              ports:
                - "8080:80"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost/healthz"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 5s
          EOF
          echo "Generated docker-compose.yml:"
          cat docker-compose.yml

      # -------------------------------------------------------------
      # Verify & Publish Ubuntu Assets Directly to GitHub Release
      # (Bypasses Actions artifact storage quota)
      # -------------------------------------------------------------
      - name: Verify Ubuntu release asset naming format
        run: |
          echo "Verifying generated release assets:"
          test -f monster-lab-android.apk
          test -f monster-lab-android.aab
          test -f "monster-lab-${PACKAGE_VERSION}-android.apk"
          test -f "monster-lab-${PACKAGE_VERSION}-android.aab"
          test -f monster-lab-linux.deb
          test -f monster-lab-linux-portable.tar.gz
          test -f "monster-lab-${PACKAGE_VERSION}-linux.deb"
          test -f "monster-lab-${PACKAGE_VERSION}-linux-portable.tar.gz"
          test -f monster-lab-keyring.gpg
          test -f docker-compose.yml
          echo "All Ubuntu release assets conform to naming schema!"

      - name: Publish Ubuntu Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            monster-lab-android.apk
            monster-lab-android.aab
            monster-lab-*-android.apk
            monster-lab-*-android.aab
            monster-lab-linux.deb
            monster-lab-linux-portable.tar.gz
            monster-lab-*-linux.deb
            monster-lab-*-linux-portable.tar.gz
            monster-lab-keyring.gpg
            docker-compose.yml
          generate_release_notes: true
          draft: false
          prerelease: false

  build-windows-target:
    name: Build Windows Desktop Releases
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate release branding assets
        run: python scripts/generate_release_assets.py

      # -------------------------------------------------------------
      # Windows Builds: [app]-[os].[ext] & [app]-[os]-portable.[ext]
      # -------------------------------------------------------------
      - name: Determine Release Package Version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match "^v\d") {
            $ver = "${{ github.ref_name }}"
          } else {
            $pubspec = Get-Content pubspec.yaml -Raw
            if ($pubspec -match "version:\s*(\d+\.\d+\.\d+)") {
              $ver = "v" + $Matches[1]
            } else {
              $ver = "v1.0.0"
            }
          }
          "PACKAGE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using release package version prefix: $ver"

      - name: Build Windows Release Binary
        run: flutter build windows --release

      - name: Build Windows Setup Installer EXE (monster-lab-windows.exe & monster-lab-${PACKAGE_VERSION}-windows.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\monster_lab_setup.iss
          Copy-Item "monster-lab-windows.exe" -Destination "monster-lab-$env:PACKAGE_VERSION-windows.exe"

      - name: Package Windows Portable Bundle (monster-lab-windows-portable.zip & monster-lab-${PACKAGE_VERSION}-windows-portable.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath monster-lab-windows-portable.zip
          Copy-Item "monster-lab-windows-portable.zip" -Destination "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip"

      # -------------------------------------------------------------
      # Verify & Publish Windows Assets Directly to GitHub Release
      # (Bypasses Actions artifact storage quota)
      # -------------------------------------------------------------
      - name: Verify Windows release asset naming format
        shell: pwsh
        run: |
          if (-not (Test-Path monster-lab-windows.exe)) { throw "monster-lab-windows.exe missing" }
          if (-not (Test-Path "monster-lab-$env:PACKAGE_VERSION-windows.exe")) { throw "monster-lab-$env:PACKAGE_VERSION-windows.exe missing" }
          if (-not (Test-Path monster-lab-windows-portable.zip)) { throw "monster-lab-windows-portable.zip missing" }
          if (-not (Test-Path "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip")) { throw "monster-lab-$env:PACKAGE_VERSION-windows-portable.zip missing" }
          Write-Host "All Windows release assets conform to naming schema!"

      - name: Publish Windows Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            monster-lab-windows.exe
            monster-lab-*-windows.exe
            monster-lab-windows-portable.zip
            monster-lab-*-windows-portable.zip
          draft: false
          prerelease: false
