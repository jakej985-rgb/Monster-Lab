name: Dispatch to Central APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.4)"
        required: true
        type: string
      deb_url:
        description: "Direct download URL to .deb asset (optional)"
        required: false
        type: string

jobs:
  dispatch-to-apt:
    name: Notify m3tal-apt-key
    runs-on: ubuntu-latest
    steps:
      - name: Validate Dispatch Token
        id: check-token
        run: |
          if [ -z "${{ secrets.M3TAL_APT_DISPATCH_TOKEN }}" ] && [ -z "${{ secrets.M3TAL_HUB_TOKEN }}" ]; then
            echo "::warning ::Neither M3TAL_APT_DISPATCH_TOKEN nor M3TAL_HUB_TOKEN secret is configured. Skipping automatic dispatch to central APT repository."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine Target Release Version
        id: target
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          CLEAN_VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Locate Release Deb Asset URL
        id: locate-asset
        if: steps.check-token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.deb_url }}" ]; then
            DEB_URL="${{ github.event.inputs.deb_url }}"
          else
            TAG="${{ steps.target.outputs.tag }}"
            REPO="${{ github.repository }}"
            DEB_URL=$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[] | select(.name | endswith(".deb")) | .url' 2>/dev/null | head -n 1 || true)
            if [ -z "$DEB_URL" ]; then
              DEB_URL="https://github.com/${REPO}/releases/download/${TAG}/monster-lab-${TAG}-linux.deb"
            fi
          fi
          echo "Found deb asset URL: ${DEB_URL}"
          echo "deb_url=${DEB_URL}" >> $GITHUB_OUTPUT

      - name: Dispatch Release Event to Central APT Repository
        if: steps.check-token.outputs.configured == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.M3TAL_APT_DISPATCH_TOKEN || secrets.M3TAL_HUB_TOKEN }}
          repository: jakej985-rgb/m3tal-apt-key
          event-type: publish-deb
          client-payload: >-
            {
              "package_id": "monster-lab",
              "repo": "${{ github.repository }}",
              "version": "${{ steps.target.outputs.clean_version }}",
              "tag": "${{ steps.target.outputs.tag }}",
              "deb_url": "${{ steps.locate-asset.outputs.deb_url }}"
            }

      - name: Confirm Dispatch
        if: steps.check-token.outputs.configured == 'true'
        run: |
          echo "Successfully dispatched publish-deb event for monster-lab ${{ steps.target.outputs.clean_version }} to jakej985-rgb/m3tal-apt-key."
