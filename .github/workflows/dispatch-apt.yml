name: Dispatch to Central APT Repository

on:
  # Release builds dispatch this event directly after the .deb is uploaded.
  # Do not trigger on release:published, which fires before assets exist.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.4)"
        required: true
        type: string
      deb_url:
        description: "Direct download URL to .deb asset (optional)"
        required: false
        type: string

jobs:
  dispatch-to-apt:
    name: Notify m3tal-apt-key
    runs-on: ubuntu-latest
    steps:
      - name: Validate Dispatch Token
        id: check-token
        run: |
          TOKEN="${{ secrets.M3TAL_APT_DISPATCH_TOKEN || secrets.HUB_DISPATCH_TOKEN || secrets.M3TAL_HUB_TOKEN || secrets.GH_PAT }}"
          if [ -z "$TOKEN" ]; then
            echo "::error ::No dispatch token configured (M3TAL_APT_DISPATCH_TOKEN, HUB_DISPATCH_TOKEN, M3TAL_HUB_TOKEN, or GH_PAT). Refusing to proceed with release dispatch."
            exit 1
          fi
          echo "configured=true" >> $GITHUB_OUTPUT

      - name: Determine Target Release Version
        id: target
        run: |
          TAG="${{ github.event.inputs.version }}"
          CLEAN_VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Locate Release Deb Asset URL & Compute SHA256
        id: locate-asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.deb_url }}" ]; then
            DEB_URL="${{ github.event.inputs.deb_url }}"
          else
            TAG="${{ steps.target.outputs.tag }}"
            REPO="${{ github.repository }}"
            DEB_URL=$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[] | select(.name | endswith(".deb")) | .browser_download_url' 2>/dev/null | head -n 1 || true)
            if [ -z "$DEB_URL" ]; then
              DEB_URL="https://github.com/${REPO}/releases/download/${TAG}/monster-lab-${TAG}-linux.deb"
            fi
          fi
          echo "Found deb asset URL: ${DEB_URL}"
          echo "deb_url=${DEB_URL}" >> $GITHUB_OUTPUT

          temp_deb="/tmp/incoming_deb_checksum.deb"
          curl -sL --fail --retry 5 --retry-delay 10 "$DEB_URL" -o "$temp_deb"
          SHA256=$(sha256sum "$temp_deb" | cut -d ' ' -f1)
          rm -f "$temp_deb"
          echo "Calculated deb asset SHA256: ${SHA256}"
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Dispatch Release Event to Central APT Repository
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.M3TAL_APT_DISPATCH_TOKEN || secrets.HUB_DISPATCH_TOKEN || secrets.M3TAL_HUB_TOKEN || secrets.GH_PAT }}
          repository: jakej985-rgb/m3tal-apt-key
          event-type: publish-deb
          client-payload: >-
            {
              "package_id": "monster-lab",
              "repo": "${{ github.repository }}",
              "version": "${{ steps.target.outputs.clean_version }}",
              "tag": "${{ steps.target.outputs.tag }}",
              "deb_url": "${{ steps.locate-asset.outputs.deb_url }}",
              "sha256": "${{ steps.locate-asset.outputs.sha256 }}",
              "allow_replace": false
            }

      - name: Confirm Dispatch
        if: steps.check-token.outputs.configured == 'true'
        run: |
          echo "Successfully dispatched publish-deb event for monster-lab ${{ steps.target.outputs.clean_version }} to jakej985-rgb/m3tal-apt-key."
