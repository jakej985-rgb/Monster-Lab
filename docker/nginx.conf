server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for Fast Classroom Network Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Ensure correct MIME type for WebAssembly (CanvasKit)
    types {
        application/wasm wasm;
    }

    # Static Assets Caching (1 Year Immutable)
    location ~* \.(?:css|js|wasm|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA Service Worker & Manifest: Never Cache (Immediate Updates)
    location ~* (?:flutter_service_worker\.js|manifest\.json|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Single Page Application (SPA) Routing for go_router
    # Any route (e.g. /learn/lesson_01, /parts/comp_05, /parent) falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Container Healthcheck Endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
