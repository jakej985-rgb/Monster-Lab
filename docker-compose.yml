services:
  monster-lab-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: monster-lab-web:latest
    container_name: monster-lab-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
